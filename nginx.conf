server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript image/svg+xml;

    # Serve files, directory index, or 404
    # Alte Adressen (z. B. /anwendung-naturstein.html) dauerhaft auf die neuen umleiten
    include /etc/nginx/conf.d/redirects.inc;

    # /index.html und übrige .html-Aufrufe auf die Adresse ohne Endung
    location = /index.html { return 301 /$is_args$args; }
    location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }

    # Saubere Adressen: /kontakt -> kontakt.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Cache static assets (images, css, js) for 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|avif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Hide Nginx version
    server_tokens off;
}
